name: ark-shop-nestjs

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-app
    restart: unless-stopped
    user: "root"
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "
      npm install &&
      npx prisma generate &&
      npm run start:dev
      "
    networks:
      - nestjs-network

networks:
  nestjs-network:
    driver: bridge
