# ============================================
# D'Ark Games Store — Docker Compose (Production)
# ============================================
# Uso:
#   docker compose up -d                          # Pull image do Docker Hub
#   docker compose up -d --build                   # Build local (dev)
#   COMPOSE_PROFILES=local docker compose up -d   # Build local (explicit)
# ============================================
name: ark-shop

services:
  app:
    # Produção: docker compose up -d           → pull da imagem do Docker Hub
    # Desenvolvimento: docker compose up --build → build local
    image: arthuriarley/ark-shop-back:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ark-shop-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3000/api/health/ready',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ark-network

  postgres:
    image: postgres:16-alpine
    container_name: ark-shop-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ark_shop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ark_shop}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ark-network

volumes:
  postgres_data:
    driver: local

networks:
  ark-network:
    driver: bridge
