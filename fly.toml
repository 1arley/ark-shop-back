app = 'ark-shop-back'
primary_region = 'iad'

[build]

[env]
  PORT = '3000'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.ports]]
    port = 80
    handlers = ['health']
  [[http_service.ports]]
    port = 443
    handlers = ['tls', 'http']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = 512

[deploy]
  release_command = 'npx prisma migrate deploy --timeout 60'

[checks]
  [checks.health]
    port = 3000
    path = "/api"
    interval = "10s"
    timeout = "5s"
    grace_period = "30s"
