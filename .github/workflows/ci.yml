name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx dotenv-cli -e .env.test -- npx prisma generate

      - name: Apply Prisma Migrations (CI)
        run: npx dotenv-cli -e .env.test -- npx prisma migrate deploy

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npx dotenv-cli -e .env.test -- npm run test:cov

      - name: Check coverage threshold (30%)
        run: |
          TOTAL=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          echo "Line coverage: ${TOTAL}%"
          if (( $(echo "$TOTAL < 30" | bc -l) )); then
            echo "❌ Coverage ${TOTAL}% is below 30% threshold"
            exit 1
          fi
          echo "✅ Coverage ${TOTAL}% meets threshold"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Generate Prisma Client
        run: npx dotenv-cli -e .env.test -- npx prisma generate

      - name: Apply Prisma Migrations (CI)
        run: npx dotenv-cli -e .env.test -- npx prisma migrate deploy

      - name: Push database schema
        run: npx dotenv-cli -e .env.test -- npx prisma db push --force-reset

      - name: Run linter
        run: npm run lint

      - name: Run E2E tests
        run: npx dotenv-cli -e .env.test -- npx jest --config ./test/jest-e2e.json --runInBand --forceExit

      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml rm -sf

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          load: true
          tags: nestjs-template:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHE_BUST=${{ github.run_id }}

      - name: Verify image
        run: docker images nestjs-template:test

      - name: Security scan (Trivy) — list vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nestjs-template:test
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          ignorefile: '.trivyignore'

      - name: Generate SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nestjs-template:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          ignorefile: '.trivyignore'

      - name: Check for vulnerabilities
        run: |
          # SARIF levels: critical=CRITICAL, error=HIGH, warning=MEDIUM, note=LOW, info=UNKNOWN
          VULN_COUNT=$(jq '[.runs[0].results[] | select(.level == "critical" or .level == "error")] | length' trivy-results.sarif 2>/dev/null || echo "0")
          echo "Found ${VULN_COUNT} CRITICAL/HIGH vulnerabilities"
          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "❌ Security gate failed: ${VULN_COUNT} vulnerabilities detected"
            jq '[.runs[0].results[] | select(.level == "critical" or .level == "error") | {ruleId, level, message: .message.text}]' trivy-results.sarif
            exit 1
          fi
          echo "✅ Security gate passed: 0 CRITICAL/HIGH vulnerabilities"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          wait-for-processing: false
